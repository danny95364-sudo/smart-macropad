# SIKAI 6 鍵 1 旋鈕（USB 1189:8840）的按鍵設定
# 寫入鍵盤（Windows 要先裝 UsbDk，型號要手動指定）：
#   ch57x-keyboard-tool.exe --vendor-id 4489 --product-id 34880 upload < keyboard-mapping.yaml
# 每顆鍵送出 config.toml [hotkeys] 對應的組合鍵，功能由常駐程式決定。
# 按鍵編號：上排左到右 1、2、3，下排左到右 4、5、6（旋鈕在右邊）。
# 三層都設一樣，誤按切層鍵也不會跑掉。

orientation: normal
rows: 2
columns: 3
knobs: 1

layers:
  - buttons:
      - ["ctrl-alt-shift-1", "ctrl-alt-shift-2", "ctrl-alt-shift-3"]
      - ["ctrl-alt-shift-4", "ctrl-alt-shift-5", "ctrl-alt-shift-6"]
    knobs:
      - ccw: "ctrl-alt-shift-7"
        press: "ctrl-alt-shift-9"
        cw: "ctrl-alt-shift-8"
  - buttons:
      - ["ctrl-alt-shift-1", "ctrl-alt-shift-2", "ctrl-alt-shift-3"]
      - ["ctrl-alt-shift-4", "ctrl-alt-shift-5", "ctrl-alt-shift-6"]
    knobs:
      - ccw: "ctrl-alt-shift-7"
        press: "ctrl-alt-shift-9"
        cw: "ctrl-alt-shift-8"
  - buttons:
      - ["ctrl-alt-shift-1", "ctrl-alt-shift-2", "ctrl-alt-shift-3"]
      - ["ctrl-alt-shift-4", "ctrl-alt-shift-5", "ctrl-alt-shift-6"]
    knobs:
      - ccw: "ctrl-alt-shift-7"
        press: "ctrl-alt-shift-9"
        cw: "ctrl-alt-shift-8"
