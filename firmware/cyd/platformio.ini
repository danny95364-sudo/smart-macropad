; ESP32 CYD 2.8 吋看板韌體：收序列埠一行一個 JSON，照方向 B 色塊畫。
; 資料格式見 macropad/display.py 檔頭；計畫見 design/cyd-firmware-plan.md。
;
; 面板驅動有兩種，實機確認哪個正確（開機畫面會大字顯示目前是哪一個）：
;   pio run -e cyd_st7789  -t upload
;   pio run -e cyd_ili9341 -t upload
;
; 小遊戲「六鎖保險箱」（只編 src/game/，計畫見 design/cyd-game-plan.md）：
;   pio run -e cyd_game -t upload
;
; 循環 GIF 播放器（只編 src/gif/，計畫見 design/cyd-gif-plan.md）：
;   python tools/make_gif.py 影片.mp4 名字      ← 轉檔到 firmware/cyd/data/
;   pio run -e cyd_gif -t upload
;   pio run -e cyd_gif -t uploadfs             ← 把 data/ 燒進 LittleFS
;
; 單字卡 UI demo（只編 src/vocab/，計畫見 design/cyd-vocab-plan.md）：
;   pio run -e cyd_vocab -t upload

[platformio]
default_envs = cyd_st7789
; 專案路徑有中文，工具鏈在 Windows 上處理不了，編譯產物放到純英文路徑
build_dir = ${sysenv.USERPROFILE}/.pio-cyd/build
libdeps_dir = ${sysenv.USERPROFILE}/.pio-cyd/libdeps

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
; efont 繁中字型很大，預設 1.2MB 程式區放不下
board_build.partitions = huge_app.csv
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
; src/game/ 是小遊戲韌體（env cyd_game）、src/gif/ 是 GIF 播放器（env cyd_gif）、src/vocab/ 是單字卡 demo（env cyd_vocab），看板 env 不編
build_src_filter = +<*> -<game/> -<gif/> -<vocab/>

; PANEL_INVERT：顏色反相（黑白顛倒時改這個，或執行時送 {"t":"inv","v":0/1}）
; PANEL_ROTATION：橫放方向（上下或左右顛倒時改，或執行時送 {"t":"rot","v":1/3}）
[env:cyd_ili9341]
build_flags =
    ${env.build_flags}
    -DPANEL_ILI9341
    -DPANEL_INVERT=0
    -DPANEL_ROTATION=1

[env:cyd_st7789]
build_flags =
    ${env.build_flags}
    -DPANEL_ST7789
    -DPANEL_INVERT=1
    -DPANEL_ROTATION=1

; 小遊戲：ST7789 那組設定，只編 src/game/
[env:cyd_game]
build_src_filter = -<*> +<game/>
; CYD_TOUCH：開 XPT2046 觸控（重開按鈕）；校正值見 include/lgfx_cyd.hpp 的 TOUCH_*
build_flags =
    ${env.build_flags}
    -DCYD_TOUCH
    ; 實機：點右上角讀到 y≈215，Y 軸顛倒，min/max 對調
    -DTOUCH_Y_MIN=3900
    -DTOUCH_Y_MAX=200
    -DPANEL_ST7789
    -DPANEL_INVERT=1
    -DPANEL_ROTATION=1

; 循環 GIF 播放器：ST7789 那組設定 + 觸控，只編 src/gif/，GIF 放 LittleFS（data/ 用 uploadfs 燒）
[env:cyd_gif]
build_src_filter = -<*> +<gif/>
board_build.filesystem = littlefs
; app 1MB + LittleFS 約 2.9MB（見 partitions_gif.csv）
board_build.partitions = partitions_gif.csv
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    bitbank2/AnimatedGIF@^2.1.1
build_flags =
    ${env.build_flags}
    -DCYD_TOUCH
    -DTOUCH_Y_MIN=3900
    -DTOUCH_Y_MAX=200
    -DPANEL_ST7789
    -DPANEL_INVERT=0
    -DPANEL_ROTATION=1

; 單字卡 UI demo：ST7789 + 觸控，只編 src/vocab/；資料寫死、不連電腦、不開無線
; 這塊板子 cyd_gif 實測 PANEL_INVERT=0 顏色才對
[env:cyd_vocab]
build_src_filter = -<*> +<vocab/>
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
build_flags =
    ${env.build_flags}
    -DCYD_TOUCH
    -DTOUCH_Y_MIN=3900
    -DTOUCH_Y_MAX=200
    -DPANEL_ST7789
    -DPANEL_INVERT=0
    -DPANEL_ROTATION=1
